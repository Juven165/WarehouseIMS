{% extends 'main/base_admin.html' %}

{% block title %}Pending Approvals{% endblock %}

{% block content %}
    <div class="container-fluid">
        <div class="header">
            <h3 class="fw-semibold">Pending Approvals</h3>
            <p class="text-muted">Manage and monitor approvals deliveries</p>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body">
                <form method="get" class="row g-3 align-items-end">
                    <div class="col-md-5">
                        <label class="form-label">Search</label>
                        <input type="text"
                                name="q"
                                class="form-control"
                                placeholder="Search product, sku, supplier..."
                                value="{{ query }}">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Date From</label>
                        <input type="date" name="date_from" class="form-control" value="{{ date_from }}">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Date To</label>
                        <input type="date" name="date_to" class="form-control" value="{{ date_to }}">
                    </div>

                    <div class="col-md-1">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-funnel"></i> Filter
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
