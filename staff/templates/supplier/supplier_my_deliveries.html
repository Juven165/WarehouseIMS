{% extends 'main/base_suppliers.html' %}

{% block title %}My Deliveries | Warehouse IMS{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="header">
        <h3>My Deliveries</h3>
    </div>

    <div class="row g-4">
        <div class="col-xl-4 col-md-3">
            <div class="deliveries-card shadow-sm">

                <div class="icon-box deliveries-icon">
                    <i class="bi bi-calendar-check"></i>
                </div>

                <div class="card-level">
                    Total Deliveries This Month
                </div>

                <div class="card-number">
                    {{ deliveries_this_month }}
                </div>
            </div>

            <div class="col-xl-4 col-md-3">
                <div class="deliveries-card shadow-sm">

                    <div class="icon-box pending-icon">
                        <i class="bi bi-hourglass-split"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
