<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Warehouse IMS{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            background: #F5F7FA;
            min-height: 100vh;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    {% if messages %}
    <div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3"
         style="z-index: 1080;">
        {% for message in messages %}
        <div class="toast align-items-center border-0 text-white
            {% if message.tags == 'success' %}bg-success
            {% elif message.tags == 'error' or message.tags == 'danger' %}bg-danger
            {% elif message.tags == 'warning' %}bg-warning text-dark
            {% elif message.tags == 'info' %}bg-info text-dark
            {% else %}bg-secondary{% endif %}"
            role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">{{ message }}</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.toast').forEach(function (el) {
                new bootstrap.Toast(el, { delay: 3000 }).show();
            });
        });
    </script>
</body>
</html>
