{% extends 'main/base_staff.html' %}

{% block title %}Update Product|Staff{% endblock %}

{% block content %}
    <div class="card update-card">
        <div class="card-title bg-primary text-center">
            <h3><i class="bi bi-pencil-square"></i>Update Product</h3>
        </div>

        <div class="card-body">
            <div class="row">

                <div class="col-md-6">
                    <label class="form-label">SKU<span class="badge text-danger">*</span></label>
                    {{ form.sku }}
                </div>

                <div class="col-md-6">
                    <label class="form-label">Product Name<span class="badge text-danger">*</span></label>
                    {{ form.name }}
                </div>

                <div class="col-md-6">
                    <label class="form-label">Category<span class="badge text-danger">*</span></label>
                    {{ form.category }}
                </div>

                <div class="col-md-6">
                    <label class="form-label">Unit<span class="badge text-danger">*</span></label>
                    {{ form.category }}
                </div>

                <div class="col-md-6">
                    <label class="form-label">Unit<span class="badge text-danger">*</span></label>
                    {{ form.unit }}
                </div>

                <div class="col-md-6">
                    <label class="form-label">Low Stock Threshold<span class="badge text-danger">*</span></label>
                    {{ form.low_stock }}
                </div>

                <div class="col-md-6">
                    <label class="form-control">Supplier<span class="badge text-danger">*</span></label>
                    {{ form.supplier }}
                </div>

                <div class="d-flex justify-content-end"></div>

            </div>
        </div>
    </div>
{% endblock %}
