{% load widget_tweaks %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Warehouse IMS</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body {
            background: linear-gradient(135deg, #475569 0%, #334155 100%);
            font-family: "Poppins", sans-serif;
        }

        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .card {
            background:#3b4a63;
            border:1px solid rgba(255,255,255,.08);
            backdrop-filter:blur(12px);
            border-radius:20px;
            box-shadow:0 15px 35px rgba(0,0,0,.35);
            padding: 45px 40px;
            width: 100%;
            max-width: 430px;
            text-align: center;
            color: #fff;
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .title {
            font-weight: 700;
            font-size:1.8rem;
            color: #fff;
        }

        .text {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 25px;
            margin-top: 10px;
        }

        .form-group {
            position: relative;
            margin-bottom: 25px;
        }

        .form-group input{
            width:100%;
            height:56px;
            padding:0 50px;
            border-radius:18px;
            border:none;
            background:#fff;
            color:#333;
            font-size:.95rem;
            width:100% !important;
            box-sizing:border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00c851;
            box-shadow: 0 0 0 3px rgba(0, 200, 81, 0.15);
        }

        .form-group input::placeholder {
            color: transparent;
        }

        .form-group label {
            position: absolute;
            top: 28px;
            left:55px;
            transform: translateY(-50%);
            color: #6c757d;
            font-size: 0.9rem;
            pointer-events: none;
            transition: all 0.2s ease-in-out;
            background: transparent;
        }

        .form-group input:focus + label,
        .form-group input:not(:placeholder-shown) + label {
            top: 5px;
            left: 45px;
            font-size: 0.75rem;
            color: #007bff;
            background: rgba(255, 255, 255, 0.95);
            padding: 0.6px;
            border-radius: 5px;
        }

        .input-icon {
            position: absolute;
            top: 50%;
            left: 18px;
            transform: translateY(-50%);
            color: #007bff;
            font-size: 1.1rem;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            color:#94A3B8;
            cursor: pointer;
            transform: 1.25rem;
        }

        .toggle-password:hover{
            color:#2563EB;
        }

        .btn-login{
            width:100%;
            height:55px;
            border-radius:15px;
            background:linear-gradient(135deg,#2563EB,#1D4ED8);
            color:#fff;
            border:none;
            font-weight:600;
            transition:.3s;
        }

        .btn-login:hover{
            transform:translateY(-3px);
            box-shadow:0 12px 25px rgba(37,99,235,.35);
        }

        .btn-login:active{
            transform:scale(.98);
        }

        .links{
            margin-top:30px;
        }

        .links p{
            margin-bottom:18px;
        }

        .links a{
            color:#60A5FA;
            text-decoration:none;
            font-weight:600;
        }

        .links a:hover{
            text-decoration:underline;
        }

    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="card">
            <h3 class="title"><i class="bi bi-box-arrow-right me-2"></i>Login</h3>
            <p class="text"> Welcome to <strong>Warehouse IMS</strong> your reliable warehouse and inventory management solution.</p>

            <form method="post" novalidate>
                {% csrf_token %}

                <div class="form-group">
                    <i class="bi bi-person input-icon"></i>
                    <input type="text"
                           name="username"
                           id="id_username"
                           placeholder=" "
                           required>

                    <label for="id_username">Username</label>
                </div>

                <div class="form-group">
                    <i class="bi bi-lock input-icon"></i>
                    <input type="password"
                           name="password"
                           id="id_password"
                           placeholder=" "
                           required>

                    <label for="id_password">Password</label>

                    <i class="bi bi-eye toggle-password fs-4"
                       id="togglePassword"></i>
                </div>

                <div class="d-grid mt-3">
                    <button type="submit" class="btn btn-login text-white fw-semibold">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Login
                    </button>
                </div>
            </form>

            <div class="links mt-4">
                <p>
                    Forgot Password?<br>
                    <a href="#">Forgot Password</a>
                </p>

                <p>
                    Don't have an account?<br>
                    <a href="{% url 'register' %}">Register</a>
                </p>
            </div>
        </div>
    </div>

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<script>
    const togglePassword = document.getElementById("togglePassword");
    const passwordField = document.getElementById("id_password");

    togglePassword.addEventListener("click", function () {
        const type =
            passwordField.getAttribute("type") === "password"
                ? "text"
                : "password";

        passwordField.setAttribute("type", type);

        this.classList.toggle("bi-eye");
        this.classList.toggle("bi-eye-slash");
    });
</script>

</body>
</html>
