{% extends 'main/base_auth.html' %}

{% block title %}Forgot Password{% endblock %}

{% block content %}

    <style>
        body {
            background: linear-gradient(135deg, #475569 0%, #334155 100%);
            font-family: "Poppins", sans-serif;
        }

        .form-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .form-card {
            background: #334155;
            width: 420px;
            backdrop-filter: blur(18px);
            padding: 50px 40px;
            border-radius: 26px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.45);
            animation: slideIn .6s ease;
            color: white;
        }

        .form-title {
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 5px;
        }

        .form-subtitle {
            text-align: center;
            font-size: 14px;
            color: #c7d2fe;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: center;
        }

        .form-group label{
            display: block;
            max-width: 320px;
            margin: 0 auto 6px;
            text-align: left;
            font-size: 13px;
            font-weight: 500;
            opacity: 0.9;
        }

        .form-control {
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
            padding: 13px 14px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
            color: #111;
            height: 50px;
            transition: 0.25s ease;
        }

        .form-control:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(99,102,241,.35);
        }

        .btn-reset {
            display: block;
            max-width: 320px;
            width: 100%;
            margin: 10px auto 0;
            padding: 10px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #6366f1, #3b82f6);
            color: white;
            font-weight: 600;
            font-size: 15px;
            transition: 0.3s ease;
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(99,102,241,.45);
        }

        .links {
            text-align: center;
            margin-top: 20px;
            font-size: 16px;
        }

        .links a {
            color: #a5b4fc;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        @keyframes slideIn {
          from {opacity:0; transform: translateY(25px);}
          to {opacity:1; transform: translateY(0);}
        }
    </style>
    <div class="form-wrapper">
        <div class="form-card">

            <h2 class="form-title">Forgot Password</h2>
            <p class="form-subtitle">Enter your email to receive a reset link</p>

            <form method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" name="email" id="email"
                        class="form-control"
                        placeholder="Enter your email"
                        required>
                </div>

                <button type="submit" class="btn-reset">Send Reset Link</button>
            </form>

            <div class="links">
                <p>
                    <a href="{% url 'login' %}">Back to Login</a>
                </p>
            </div>
        </div>
    </div>
{% endblock %}
